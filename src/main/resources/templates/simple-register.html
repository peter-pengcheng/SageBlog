<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - SageBlog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引用外部样式 -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .register-container {
            max-width: 550px;
            margin: 3rem auto;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            transition: transform 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .register-icon {
            margin-bottom: 1.5rem;
        }

        .register-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #6c757d;
            padding-left: 1rem;
            margin-top: 0.25rem;
        }

        .password-requirements ul {
            padding-left: 1rem;
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book-reader me-2"></i>SageBlog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i>登录
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/register}">
                            <i class="fas fa-user-plus me-1"></i>注册
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main>
        <div class="register-container">
            <div class="register-header">
                <div class="register-icon">
                    <i class="fas fa-user-plus fa-4x text-primary"></i>
                </div>
                <h1 class="h3 mb-3">创建新账号</h1>
                <p class="text-muted">欢迎注册 SageBlog，创建您的专属账号</p>
            </div>

            <!-- 注册表单 -->
            <form id="registerForm" th:action="@{/api/auth/register}" method="post">
                <!-- 错误消息 -->
                <div id="register-error" class="alert alert-danger mb-4" style="display: none;">
                    <i class="fas fa-exclamation-circle me-2"></i><span id="error-message">注册出错</span>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名"
                                required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="nickname" class="form-label">昵称</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                            <input type="text" class="form-control" id="nickname" name="nickname" placeholder="请输入昵称"
                                required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">电子邮箱</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="请输入电子邮箱" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">手机号码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入手机号码">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码"
                            required>
                    </div>
                    <div class="password-requirements">
                        <small>密码要求：</small>
                        <ul>
                            <li>至少8个字符</li>
                            <li>包含大小写字母和数字</li>
                        </ul>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            placeholder="请确认密码" required>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="agreeTerms" name="agreeTerms" required>
                    <label class="form-check-label" for="agreeTerms">
                        我已阅读并同意<a href="#" class="text-decoration-none">服务条款</a>和<a href="#"
                            class="text-decoration-none">隐私政策</a>
                    </label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus me-2"></i>注册
                    </button>
                </div>
            </form>

            <div class="register-footer">
                <div>
                    已有账号?
                    <a th:href="@{/login}" class="text-decoration-none">
                        <i class="fas fa-sign-in-alt me-1"></i>立即登录
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p class="mb-0">&copy; 2023 SageBlog. 保留所有权利。</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-white me-3">隐私政策</a>
                    <a href="#" class="text-white">服务条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // 表单提交
            $('#registerForm').submit(function (e) {
                e.preventDefault();

                // 验证密码
                const password = $('#password').val();
                const confirmPassword = $('#confirmPassword').val();

                if (password !== confirmPassword) {
                    $('#error-message').text('两次输入的密码不一致');
                    $('#register-error').show();
                    return;
                }

                // 构建注册数据
                const registerData = {
                    username: $('#username').val(),
                    nickname: $('#nickname').val(),
                    email: $('#email').val(),
                    phone: $('#phone').val(),
                    password: password,
                    confirmPassword: confirmPassword
                };

                // 发送注册请求
                $.ajax({
                    url: '/sageblog/api/auth/register',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(registerData),
                    success: function (response) {
                        if (response.code === 200) {
                            // 注册成功，跳转到注册成功页面
                            window.location.href = '/sageblog/register-success';
                        } else {
                            // 显示错误信息
                            $('#error-message').text(response.message);
                            $('#register-error').show();
                        }
                    },
                    error: function (xhr) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            $('#error-message').text(response.message);
                        } catch (e) {
                            $('#error-message').text('注册失败，请稍后重试');
                        }
                        $('#register-error').show();
                    }
                });
            });
        });
    </script>
</body>

</html>
