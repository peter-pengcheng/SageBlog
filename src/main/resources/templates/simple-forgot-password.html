<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - SageBlog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引用外部样式 -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .forgot-container {
            max-width: 450px;
            margin: 5rem auto;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            transition: transform 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .forgot-icon {
            margin-bottom: 1.5rem;
        }

        .forgot-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book-reader me-2"></i>SageBlog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i>登录
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/register}">
                            <i class="fas fa-user-plus me-1"></i>注册
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main>
        <div class="forgot-container">
            <div class="forgot-header">
                <div class="forgot-icon">
                    <i class="fas fa-key fa-4x text-primary"></i>
                </div>
                <h1 class="h3 mb-3">找回密码</h1>
                <p class="text-muted mb-4">请输入您的注册邮箱，我们将发送重置密码链接至您的邮箱</p>
            </div>

            <!-- 忘记密码表单 -->
            <form id="forgotPasswordForm">
                <!-- 提示消息 -->
                <div id="message-alert" class="alert d-none mb-4">
                    <i id="message-icon" class="fas me-2"></i>
                    <span id="message-content"></span>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">电子邮箱</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="请输入您的注册邮箱"
                            required>
                    </div>
                </div>

                <div class="d-grid mb-4">
                    <button type="submit" id="submitBtn" class="btn btn-primary">
                        <i class="fas fa-paper-plane me-2"></i>发送重置链接
                    </button>
                </div>
            </form>

            <div class="forgot-footer">
                <div class="mb-2">
                    <a th:href="@{/login}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>返回登录
                    </a>
                </div>
                <div>
                    没有账号?
                    <a th:href="@{/register}" class="text-decoration-none">
                        <i class="fas fa-user-plus me-1"></i>立即注册
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p class="mb-0">&copy; 2023 SageBlog. 保留所有权利。</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-white me-3">隐私政策</a>
                    <a href="#" class="text-white">服务条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const contextPath = /*[[@{/}]]*/ '';

        $(document).ready(function () {
            // 显示消息函数
            function showMessage(type, message) {
                const alertElement = $('#message-alert');
                const iconElement = $('#message-icon');
                const contentElement = $('#message-content');

                // 设置消息类型
                alertElement.removeClass('alert-success alert-danger alert-info d-none');
                alertElement.addClass(`alert-${type}`);

                // 设置图标
                if (type === 'success') {
                    iconElement.removeClass().addClass('fas fa-check-circle');
                } else if (type === 'danger') {
                    iconElement.removeClass().addClass('fas fa-exclamation-circle');
                } else {
                    iconElement.removeClass().addClass('fas fa-info-circle');
                }

                // 设置内容
                contentElement.text(message);

                // 显示消息
                alertElement.removeClass('d-none');
            }

            // 表单提交
            $('#forgotPasswordForm').submit(function (e) {
                e.preventDefault();

                const email = $('#email').val();
                const submitBtn = $('#submitBtn');

                // 禁用按钮，显示加载状态
                submitBtn.prop('disabled', true);
                submitBtn.html('<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>发送中...');

                // 发送请求
                $.ajax({
                    url: contextPath + 'api/auth/forgot-password',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ email: email }),
                    success: function (response) {
                        if (response.code === 200) {
                            showMessage('success', '重置密码链接已发送到您的邮箱，请查收！');
                            $('#email').val('');
                        } else {
                            showMessage('danger', response.message || '发送失败，请稍后重试');
                        }
                    },
                    error: function (xhr) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            showMessage('danger', response.message || '发送失败，请稍后重试');
                        } catch (e) {
                            showMessage('danger', '发送失败，请稍后重试');
                        }
                    },
                    complete: function () {
                        // 恢复按钮状态
                        submitBtn.prop('disabled', false);
                        submitBtn.html('<i class="fas fa-paper-plane me-2"></i>发送重置链接');
                    }
                });
            });
        });
        /*]]>*/
    </script>
</body>

</html>
