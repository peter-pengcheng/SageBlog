<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:fragment="styles">
        <style>
            .auth-container {
                max-width: 500px;
                margin: 2rem auto;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            }

            .auth-header {
                text-align: center;
                margin-bottom: 2rem;
            }

            .auth-header h1 {
                font-size: 2rem;
                color: #333;
            }

            .auth-footer {
                text-align: center;
                margin-top: 1.5rem;
            }

            .auth-btn {
                width: 100%;
                padding: 10px;
                border-radius: 5px;
                background-color: #3498db;
                color: white;
                font-weight: 600;
            }

            .password-requirements {
                margin-top: 5px;
                font-size: 0.8rem;
                color: #6c757d;
            }
        </style>
    </th:block>
</head>

<body>
    <div th:fragment="content">
        <div class="auth-container">
            <div class="auth-header">
                <h1>注册账号</h1>
                <p>欢迎加入SageBlog！请填写以下信息创建您的账号</p>
            </div>

            <form id="registerForm" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名 *</label>
                    <input type="text" class="form-control" id="username" name="username" required
                        pattern="[a-zA-Z0-9_]+" title="用户名只能包含字母、数字和下划线">
                    <div class="form-text">用户名长度为4-20个字符，只能包含字母、数字和下划线</div>
                </div>

                <div class="mb-3">
                    <label for="nickname" class="form-label">昵称 *</label>
                    <input type="text" class="form-control" id="nickname" name="nickname" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">邮箱 *</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">手机号</label>
                    <input type="tel" class="form-control" id="phone" name="phone">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">密码 *</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <div class="password-requirements">密码长度需要在6-20个字符之间</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">确认密码 *</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn auth-btn">注册</button>
                </div>

                <div class="auth-footer">
                    <p>已有账号？<a th:href="@{/login}">立即登录</a></p>
                </div>
            </form>
        </div>
    </div>

    <th:block th:fragment="scripts">
        <script>
            $(document).ready(function () {
                // 表单验证
                $('#registerForm').submit(function (e) {
                    e.preventDefault();

                    // 验证两次密码是否一致
                    if ($('#password').val() !== $('#confirmPassword').val()) {
                        alert('两次输入的密码不一致');
                        return;
                    }

                    // 构建请求数据
                    const registerData = {
                        username: $('#username').val(),
                        nickname: $('#nickname').val(),
                        email: $('#email').val(),
                        phone: $('#phone').val(),
                        password: $('#password').val(),
                        confirmPassword: $('#confirmPassword').val()
                    };

                    // 发送注册请求
                    $.ajax({
                        url: '/api/auth/register',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(registerData),
                        success: function (response) {
                            if (response.code === 200) {
                                // 注册成功，跳转到成功页面
                                window.location.href = '/register-success';
                            } else {
                                // 注册失败
                                alert('注册失败: ' + response.message);
                            }
                        },
                        error: function (xhr) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                alert('注册失败: ' + response.message);
                            } catch (e) {
                                alert('注册失败，请稍后重试');
                            }
                        }
                    });
                });

                // 实时验证用户名格式
                $('#username').on('input', function () {
                    const username = $(this).val();
                    const regex = /^[a-zA-Z0-9_]+$/;

                    if (username && !regex.test(username)) {
                        $(this).addClass('is-invalid');
                    } else {
                        $(this).removeClass('is-invalid');
                    }
                });

                // 实时验证两次密码是否一致
                $('#confirmPassword').on('input', function () {
                    if ($('#password').val() !== $(this).val()) {
                        $(this).addClass('is-invalid');
                    } else {
                        $(this).removeClass('is-invalid');
                    }
                });
            });
        </script>
    </th:block>
</body>

</html>
