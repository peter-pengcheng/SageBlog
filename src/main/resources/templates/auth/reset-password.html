<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:fragment="styles">
        <style>
            .auth-container {
                max-width: 400px;
                margin: 2rem auto;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            }

            .auth-header {
                text-align: center;
                margin-bottom: 2rem;
            }

            .auth-header h1 {
                font-size: 2rem;
                color: #333;
            }

            .auth-footer {
                text-align: center;
                margin-top: 1.5rem;
            }

            .auth-btn {
                width: 100%;
                padding: 10px;
                border-radius: 5px;
                background-color: #3498db;
                color: white;
                font-weight: 600;
            }

            .password-requirements {
                margin-top: 5px;
                font-size: 0.8rem;
                color: #6c757d;
            }
        </style>
    </th:block>
</head>

<body>
    <div th:fragment="content">
        <div class="auth-container">
            <div class="auth-header">
                <h1>重置密码</h1>
                <p>请输入您的新密码</p>
            </div>

            <form id="resetPasswordForm" method="post">
                <input type="hidden" id="token" name="token" th:value="${token}">

                <div class="mb-3">
                    <label for="password" class="form-label">新密码</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <div class="password-requirements">密码长度需要在6-20个字符之间</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">确认新密码</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn auth-btn">重置密码</button>
                </div>

                <div class="auth-footer">
                    <p><a th:href="@{/login}">返回登录</a></p>
                </div>
            </form>
        </div>
    </div>

    <th:block th:fragment="scripts">
        <script>
            $(document).ready(function () {
                // 验证令牌是否有效
                const token = $('#token').val();

                $.ajax({
                    url: '/api/auth/validate-reset-token',
                    type: 'GET',
                    data: { token: token },
                    success: function (response) {
                        if (response.code !== 200) {
                            // 令牌无效
                            $('#resetPasswordForm').hide();
                            $('.auth-header').html(
                                '<h1>链接已失效</h1>' +
                                '<p>您的密码重置链接已过期或无效。</p>' +
                                '<p>请重新发起密码重置请求。</p>'
                            );
                            $('.auth-footer').html(
                                '<p><a th:href="@{/forgot-password}">重新发送重置链接</a></p>'
                            );
                        }
                    },
                    error: function () {
                        // 请求失败
                        $('#resetPasswordForm').hide();
                        $('.auth-header').html(
                            '<h1>验证失败</h1>' +
                            '<p>无法验证您的重置链接。</p>' +
                            '<p>请稍后重试或重新发起密码重置请求。</p>'
                        );
                        $('.auth-footer').html(
                            '<p><a th:href="@{/forgot-password}">重新发送重置链接</a></p>'
                        );
                    }
                });

                // 表单提交
                $('#resetPasswordForm').submit(function (e) {
                    e.preventDefault();

                    // 验证两次密码是否一致
                    if ($('#password').val() !== $('#confirmPassword').val()) {
                        alert('两次输入的密码不一致');
                        return;
                    }

                    // 构建请求数据
                    const resetPasswordData = {
                        token: $('#token').val(),
                        password: $('#password').val(),
                        confirmPassword: $('#confirmPassword').val()
                    };

                    // 发送重置密码请求
                    $.ajax({
                        url: '/api/auth/reset-password',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(resetPasswordData),
                        success: function (response) {
                            if (response.code === 200) {
                                // 重置成功
                                $('#resetPasswordForm').hide();
                                $('.auth-header').html(
                                    '<h1>密码重置成功</h1>' +
                                    '<p>您的密码已成功重置。</p>' +
                                    '<p>现在可以使用新密码登录您的账号。</p>'
                                );
                                $('.auth-footer').html(
                                    '<p><a th:href="@{/login}">前往登录</a></p>'
                                );
                            } else {
                                // 重置失败
                                alert('重置失败: ' + response.message);
                            }
                        },
                        error: function (xhr) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                alert('重置失败: ' + response.message);
                            } catch (e) {
                                alert('重置失败，请稍后重试');
                            }
                        }
                    });
                });

                // 实时验证两次密码是否一致
                $('#confirmPassword').on('input', function () {
                    if ($('#password').val() !== $(this).val()) {
                        $(this).addClass('is-invalid');
                    } else {
                        $(this).removeClass('is-invalid');
                    }
                });
            });
        </script>
    </th:block>
</body>

</html>
