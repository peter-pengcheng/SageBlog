<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:fragment="styles">
        <style>
            .auth-container {
                max-width: 400px;
                margin: 2rem auto;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            }

            .auth-header {
                text-align: center;
                margin-bottom: 2rem;
            }

            .auth-header h1 {
                font-size: 2rem;
                color: #333;
            }

            .auth-footer {
                text-align: center;
                margin-top: 1.5rem;
            }

            .auth-btn {
                width: 100%;
                padding: 10px;
                border-radius: 5px;
                background-color: #3498db;
                color: white;
                font-weight: 600;
            }
        </style>
    </th:block>
</head>

<body>
    <div th:fragment="content">
        <div class="auth-container">
            <div class="auth-header">
                <h1>忘记密码</h1>
                <p>请输入您的注册邮箱，我们将向您发送密码重置链接</p>
            </div>

            <form id="forgotPasswordForm" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">邮箱地址</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn auth-btn">发送重置链接</button>
                </div>

                <div class="auth-footer">
                    <p>记起密码了？<a th:href="@{/login}">返回登录</a></p>
                </div>
            </form>
        </div>
    </div>

    <th:block th:fragment="scripts">
        <script>
            $(document).ready(function () {
                $('#forgotPasswordForm').submit(function (e) {
                    e.preventDefault();

                    // 构建请求数据
                    const forgotPasswordData = {
                        email: $('#email').val()
                    };

                    // 发送忘记密码请求
                    $.ajax({
                        url: '/api/auth/forgot-password',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(forgotPasswordData),
                        success: function (response) {
                            if (response.code === 200) {
                                // 请求成功，显示信息
                                $('#forgotPasswordForm').hide();
                                $('.auth-header').html(
                                    '<h1>邮件已发送</h1>' +
                                    '<p>我们已向您的邮箱发送了密码重置链接，请查收邮件并按照提示操作。</p>' +
                                    '<p>如果您没有收到邮件，请检查垃圾邮件文件夹或稍后重试。</p>'
                                );
                                $('.auth-footer').html(
                                    '<p><a th:href="@{/login}">返回登录页面</a></p>'
                                );
                            } else {
                                // 请求失败
                                alert('发送失败: ' + response.message);
                            }
                        },
                        error: function (xhr) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                alert('发送失败: ' + response.message);
                            } catch (e) {
                                alert('发送失败，请稍后重试');
                            }
                        }
                    });
                });
            });
        </script>
    </th:block>
</body>

</html>
