<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>注册审核通过通知</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }

        .button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>注册审核通过通知</h2>
    </div>
    <div class="content">
        <p>尊敬的 <strong th:text="${username}">用户</strong>，</p>
        <p>恭喜您！您的 SageBlog 账号注册申请已经通过审核。</p>
        <p>现在您可以使用您的用户名和密码登录系统，体验全部功能。</p>
        <a href="/sageblog/login" class="button">立即登录</a>
        <p>如有任何问题，请随时联系我们的客服团队。</p>
        <p>感谢您的支持！</p>
        <p>此致，<br>SageBlog 团队</p>
    </div>
    <div class="footer">
        <p>此邮件为系统自动发送，请勿直接回复。</p>
        <p>&copy; 2023 SageBlog. All rights reserved.</p>
    </div>
</body>

</html>
