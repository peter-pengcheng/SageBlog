<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>注册成功通知</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>注册成功通知</h2>
    </div>
    <div class="content">
        <p>尊敬的 <strong th:text="${username}">用户</strong>，</p>
        <p>恭喜您成功注册 SageBlog 系统！您的账号目前已提交，正在等待管理员审核。</p>
        <p>审核通过后，您将收到一封确认邮件，之后即可登录系统使用。</p>
        <p>如有任何问题，请联系系统管理员。</p>
        <p>感谢您的支持！</p>
        <p>此致，<br>SageBlog 团队</p>
    </div>
    <div class="footer">
        <p>此邮件为系统自动发送，请勿直接回复。</p>
        <p>&copy; 2023 SageBlog. All rights reserved.</p>
    </div>
</body>

</html>
