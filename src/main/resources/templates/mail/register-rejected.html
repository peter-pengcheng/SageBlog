<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>注册审核拒绝通知</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #f44336;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }

        .reason {
            background-color: #f9f9f9;
            padding: 10px;
            border-left: 4px solid #f44336;
            margin: 15px 0;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>注册审核拒绝通知</h2>
    </div>
    <div class="content">
        <p>尊敬的 <strong th:text="${username}">用户</strong>，</p>
        <p>很遗憾，您的 SageBlog 账号注册申请未能通过我们的审核。</p>
        <p>拒绝原因：</p>
        <div class="reason">
            <p th:text="${reason}">拒绝原因将显示在这里</p>
        </div>
        <p>如果您认为这是一个错误，或者希望重新申请，请与我们的客服团队联系。</p>
        <p>感谢您的理解！</p>
        <p>此致，<br>SageBlog 团队</p>
    </div>
    <div class="footer">
        <p>此邮件为系统自动发送，请勿直接回复。</p>
        <p>&copy; 2023 SageBlog. All rights reserved.</p>
    </div>
</body>

</html>
