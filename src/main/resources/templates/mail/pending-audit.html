<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>新用户注册待审核通知</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #2196F3;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }

        .button {
            display: inline-block;
            background-color: #2196F3;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>新用户注册待审核通知</h2>
    </div>
    <div class="content">
        <p>尊敬的管理员，</p>
        <p>系统收到新用户 <strong th:text="${username}">用户名</strong> 的注册申请，需要您进行审核。</p>
        <p>请登录管理后台，在"审核管理"页面中查看详情并处理。</p>
        <a href="/sageblog/system/audit" class="button">前往审核</a>
        <p>感谢您的配合！</p>
        <p>此致，<br>SageBlog 系统</p>
    </div>
    <div class="footer">
        <p>此邮件为系统自动发送，请勿直接回复。</p>
        <p>&copy; 2023 SageBlog. All rights reserved.</p>
    </div>
</body>

</html>
