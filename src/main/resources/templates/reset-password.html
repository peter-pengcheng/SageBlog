<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - SageBlog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引用外部样式 -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .reset-password-container {
            max-width: 450px;
            margin: 5rem auto;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            transition: transform 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
        }

        .reset-password-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .reset-password-icon {
            margin-bottom: 1.5rem;
        }

        .reset-password-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .password-strength {
            height: 5px;
            border-radius: 2px;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book-reader me-2"></i>SageBlog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i>登录
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/register}">
                            <i class="fas fa-user-plus me-1"></i>注册
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main>
        <div class="reset-password-container">
            <div class="reset-password-header">
                <div class="reset-password-icon">
                    <i class="fas fa-lock fa-4x text-primary"></i>
                </div>
                <h1 class="h3 mb-3">重置密码</h1>
                <p class="text-muted">请设置您的新密码</p>
            </div>

            <!-- 重置密码表单 -->
            <form id="resetPasswordForm">
                <!-- 隐藏的token字段 -->
                <input type="hidden" id="token" name="token" th:value="${token}">

                <!-- 成功消息 -->
                <div id="success-message" class="alert alert-success mb-4" style="display: none;">
                    <i class="fas fa-check-circle me-2"></i><span id="success-text">密码重置成功！</span>
                </div>

                <!-- 错误消息 -->
                <div id="error-message" class="alert alert-danger mb-4" style="display: none;">
                    <i class="fas fa-exclamation-circle me-2"></i><span id="error-text">重置密码失败</span>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">新密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入新密码"
                            required minlength="6" maxlength="20">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength w-100 bg-light" id="passwordStrength"></div>
                    <small class="form-text text-muted">密码长度至少6位，包含字母和数字</small>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            placeholder="请再次输入新密码" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="passwordMismatch">两次输入的密码不一致</div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-check-circle me-2"></i>确认重置
                    </button>
                </div>
            </form>

            <div class="reset-password-footer">
                <div>
                    <a th:href="@{/login}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>返回登录
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p class="mb-0">&copy; 2023 SageBlog. 保留所有权利。</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-white me-3">隐私政策</a>
                    <a href="#" class="text-white">服务条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const contextPath = /*[[@{/}]]*/ '';
        const token = /*[[${token}]]*/ '';

        $(document).ready(function () {
            // 切换密码可见性
            $('#togglePassword').click(function () {
                const passwordInput = $('#password');
                const icon = $(this).find('i');

                if (passwordInput.attr('type') === 'password') {
                    passwordInput.attr('type', 'text');
                    icon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    passwordInput.attr('type', 'password');
                    icon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });

            // 切换确认密码可见性
            $('#toggleConfirmPassword').click(function () {
                const confirmPasswordInput = $('#confirmPassword');
                const icon = $(this).find('i');

                if (confirmPasswordInput.attr('type') === 'password') {
                    confirmPasswordInput.attr('type', 'text');
                    icon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    confirmPasswordInput.attr('type', 'password');
                    icon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });

            // 密码强度检查
            $('#password').on('input', function () {
                const password = $(this).val();
                const strength = checkPasswordStrength(password);
                updatePasswordStrengthUI(strength);
            });

            // 确认密码验证
            $('#confirmPassword').on('input', function () {
                validatePasswordMatch();
            });

            // 表单提交
            $('#resetPasswordForm').submit(function (e) {
                e.preventDefault();

                if (!validateForm()) {
                    return;
                }

                // 显示加载状态
                const submitBtn = $('#submitBtn');
                const originalText = submitBtn.html();
                submitBtn.html('<i class="fas fa-spinner fa-spin me-2"></i>处理中...');
                submitBtn.prop('disabled', true);

                // 隐藏之前的消息
                $('#success-message').hide();
                $('#error-message').hide();

                // 构建请求数据
                const password = $('#password').val();
                const requestData = {
                    password: password,
                    token: token
                };

                // 发送请求
                $.ajax({
                    url: contextPath + 'api/auth/reset-password',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(requestData),
                    success: function (response) {
                        // 恢复按钮状态
                        submitBtn.html(originalText);
                        submitBtn.prop('disabled', false);

                        if (response.code === 200) {
                            // 显示成功消息
                            $('#success-text').text('密码重置成功！3秒后将跳转到登录页面');
                            $('#success-message').show();

                            // 重置表单
                            $('#resetPasswordForm')[0].reset();

                            // 3秒后跳转到登录页面
                            setTimeout(function () {
                                window.location.href = contextPath + 'login';
                            }, 3000);
                        } else {
                            // 显示错误消息
                            $('#error-text').text(response.message);
                            $('#error-message').show();
                        }
                    },
                    error: function (xhr) {
                        // 恢复按钮状态
                        submitBtn.html(originalText);
                        submitBtn.prop('disabled', false);

                        try {
                            const response = JSON.parse(xhr.responseText);
                            $('#error-text').text(response.message);
                        } catch (e) {
                            $('#error-text').text('重置密码失败，请稍后重试');
                        }
                        $('#error-message').show();
                    }
                });
            });

            // 辅助函数
            function validateForm() {
                const password = $('#password').val();
                const confirmPassword = $('#confirmPassword').val();

                // 密码复杂度检查
                if (checkPasswordStrength(password) < 2) {
                    $('#error-text').text('密码强度不足，请包含字母和数字');
                    $('#error-message').show();
                    return false;
                }

                // 密码匹配检查
                if (password !== confirmPassword) {
                    $('#passwordMismatch').show();
                    return false;
                }

                return true;
            }

            function validatePasswordMatch() {
                const password = $('#password').val();
                const confirmPassword = $('#confirmPassword').val();

                if (password === confirmPassword) {
                    $('#confirmPassword').removeClass('is-invalid').addClass('is-valid');
                    $('#passwordMismatch').hide();
                } else {
                    $('#confirmPassword').removeClass('is-valid').addClass('is-invalid');
                    $('#passwordMismatch').show();
                }
            }

            function checkPasswordStrength(password) {
                if (!password) return 0;

                let strength = 0;

                // 长度检查
                if (password.length >= 8) {
                    strength += 1;
                }

                // 包含字母检查
                if (/[a-zA-Z]/.test(password)) {
                    strength += 1;
                }

                // 包含数字检查
                if (/\d/.test(password)) {
                    strength += 1;
                }

                // 包含特殊字符检查
                if (/[^a-zA-Z0-9]/.test(password)) {
                    strength += 1;
                }

                return strength;
            }

            function updatePasswordStrengthUI(strength) {
                const strengthBar = $('#passwordStrength');

                // 清除之前的类
                strengthBar.removeClass('bg-danger bg-warning bg-info bg-success');

                // 设置强度条宽度
                let width = strength * 25;
                if (width > 0) width = Math.max(width, 25); // 最小宽度25%
                strengthBar.css('width', width + '%');

                // 根据强度设置颜色
                if (strength === 0) {
                    strengthBar.addClass('bg-light');
                } else if (strength === 1) {
                    strengthBar.addClass('bg-danger');
                } else if (strength === 2) {
                    strengthBar.addClass('bg-warning');
                } else if (strength === 3) {
                    strengthBar.addClass('bg-info');
                } else {
                    strengthBar.addClass('bg-success');
                }
            }
        });
        /*]]>*/
    </script>
</body>

</html>
