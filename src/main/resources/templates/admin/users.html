<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">用户管理 - SageBlog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引用外部样式 -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        /* 复用后台管理样式 */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: 0 2px 5px 0 rgba(0, 0, 0, 0.05);
            width: 280px;
            transition: all 0.3s;
        }

        .sidebar-sticky {
            position: relative;
            top: 0;
            height: calc(100vh - 48px);
            padding-top: 0.5rem;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .sidebar .nav-link {
            font-weight: 500;
            color: #333;
            padding: 0.75rem 1.5rem;
            position: relative;
            display: flex;
            align-items: center;
        }

        .sidebar .nav-link.active {
            color: #3498db;
            background-color: rgba(52, 152, 219, 0.1);
            border-left: 4px solid #3498db;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(52, 152, 219, 0.05);
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .sidebar .nav-item.submenu>.nav-link::after {
            content: "\f0d7";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-left: auto;
            transition: transform 0.3s;
        }

        .sidebar .nav-item.submenu.open>.nav-link::after {
            transform: rotate(180deg);
        }

        .sidebar .submenu-items {
            padding-left: 2.5rem;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .sidebar .nav-item.submenu.open .submenu-items {
            max-height: 500px;
        }

        /* 主内容区域 */
        .main-content {
            margin-left: 280px;
            padding: 2rem;
            transition: all 0.3s;
            min-height: 100vh;
        }

        /* 折叠侧边栏 */
        .sidebar-collapsed .sidebar {
            width: 70px;
        }

        .sidebar-collapsed .main-content {
            margin-left: 70px;
        }

        .sidebar-collapsed .sidebar .nav-link span,
        .sidebar-collapsed .sidebar .submenu-items,
        .sidebar-collapsed .sidebar .nav-item.submenu>.nav-link::after {
            display: none;
        }

        .sidebar-collapsed .sidebar .nav-link {
            padding: 0.75rem;
            justify-content: center;
        }

        .sidebar-collapsed .sidebar .nav-link i {
            margin-right: 0;
        }

        /* 顶部导航 */
        .navbar {
            padding-left: 280px;
            transition: all 0.3s;
        }

        .sidebar-collapsed .navbar {
            padding-left: 70px;
        }

        /* 数据表格 */
        .data-table th,
        .data-table td {
            vertical-align: middle;
        }

        /* 小屏幕适配 */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                transform: translateX(-100%);
            }

            .main-content {
                margin-left: 0;
            }

            .navbar {
                padding-left: 0;
            }

            .sidebar-toggle {
                display: block !important;
            }

            .sidebar-collapsed .sidebar {
                transform: translateX(0);
                width: 280px;
            }

            .sidebar-collapsed .main-content {
                margin-left: 0;
            }

            .sidebar-collapsed .sidebar .nav-link span,
            .sidebar-collapsed .sidebar .submenu-items,
            .sidebar-collapsed .sidebar .nav-item.submenu>.nav-link::after {
                display: block;
            }

            .sidebar-collapsed .sidebar .nav-link {
                padding: 0.75rem 1.5rem;
                justify-content: flex-start;
            }

            .sidebar-collapsed .sidebar .nav-link i {
                margin-right: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button type="button" id="sidebarToggle" class="btn btn-dark d-inline-block d-md-none me-auto">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fas fa-cogs me-2"></i>
                <span>SageBlog 管理系统</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" target="_blank">
                            <i class="fas fa-external-link-alt me-1"></i>访问前台
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle me-1"></i><span id="currentAdminUsername">管理员</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/profile}">
                                    <i class="fas fa-user me-2"></i>个人信息
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="javascript:void(0);" id="logoutBtn">
                                    <i class="fas fa-sign-out-alt me-2"></i>退出登录
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <nav class="sidebar bg-light">
        <div class="sidebar-sticky">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>仪表盘</span>
                    </a>
                </li>
                <li class="nav-item submenu open">
                    <a class="nav-link" href="javascript:void(0);">
                        <i class="fas fa-users"></i>
                        <span>用户管理</span>
                    </a>
                    <ul class="nav flex-column submenu-items">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/users}">
                                <i class="fas fa-user-cog"></i>
                                <span>用户列表</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/audits}">
                                <i class="fas fa-user-check"></i>
                                <span>用户审核</span>
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item submenu">
                    <a class="nav-link" href="javascript:void(0);">
                        <i class="fas fa-shield-alt"></i>
                        <span>权限管理</span>
                    </a>
                    <ul class="nav flex-column submenu-items">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/roles}">
                                <i class="fas fa-user-tag"></i>
                                <span>角色管理</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/permissions}">
                                <i class="fas fa-key"></i>
                                <span>权限配置</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/menus}">
                                <i class="fas fa-bars"></i>
                                <span>菜单管理</span>
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/logs}">
                        <i class="fas fa-history"></i>
                        <span>系统日志</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="toggleSidebar" href="javascript:void(0);">
                        <i class="fas fa-chevron-left"></i>
                        <span>收起菜单</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3">用户管理</h1>
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">首页</a></li>
                    <li class="breadcrumb-item active">用户管理</li>
                </ol>
            </div>

            <!-- 操作栏 -->
            <div class="card mb-4">
                <div class="card-body">
                    <form id="searchForm" class="row g-3">
                        <div class="col-md-3">
                            <input type="text" class="form-control" id="usernameSearch" name="username"
                                placeholder="用户名">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="statusSearch" name="status">
                                <option value="">全部状态</option>
                                <option value="0">待审核</option>
                                <option value="1">正常</option>
                                <option value="2">禁用</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="button" id="searchBtn" class="btn btn-primary">
                                <i class="fas fa-search me-1"></i>搜索
                            </button>
                            <button type="button" id="resetBtn" class="btn btn-secondary ms-2">
                                <i class="fas fa-redo me-1"></i>重置
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 用户列表 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>昵称</th>
                                    <th>邮箱</th>
                                    <th>状态</th>
                                    <th>注册时间</th>
                                    <th>最后登录</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr>
                                    <td colspan="8" class="text-center py-3">
                                        <i class="fas fa-spinner fa-spin me-2"></i>加载中...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 分页 -->
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <div>
                            共 <span id="totalCount">0</span> 条记录，当前显示第 <span id="currentPage">1</span>/<span
                                id="totalPages">1</span> 页
                        </div>
                        <nav aria-label="Page navigation">
                            <ul class="pagination mb-0" id="pagination">
                                <!-- 分页导航 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 用户编辑模态框 -->
    <div class="modal fade" id="userEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑用户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userEditForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="nickname" class="form-label">昵称</label>
                            <input type="text" class="form-control" id="nickname">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">状态</label>
                            <select class="form-select" id="status">
                                <option value="0">待审核</option>
                                <option value="1">正常</option>
                                <option value="2">禁用</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="remark" class="form-label">备注</label>
                            <textarea class="form-control" id="remark" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" id="saveUserBtn" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- 认证工具 -->
    <script th:src="@{/js/auth.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        $(document).ready(function () {
            // 初始化页面和加载数据
            initPage();
            loadUserData(1);

            // 搜索按钮点击事件
            $('#searchBtn').click(function () {
                loadUserData(1);
            });

            // 重置按钮点击事件
            $('#resetBtn').click(function () {
                $('#searchForm')[0].reset();
                loadUserData(1);
            });

            // 保存用户按钮点击事件
            $('#saveUserBtn').click(function () {
                saveUser();
            });

            // 展开/收起侧边栏
            $('#toggleSidebar').click(function () {
                $('body').toggleClass('sidebar-collapsed');
                const isCollapsed = $('body').hasClass('sidebar-collapsed');
                // 更新图标和文本
                if (isCollapsed) {
                    $(this).find('i').removeClass('fa-chevron-left').addClass('fa-chevron-right');
                    $(this).find('span').text('展开菜单');
                } else {
                    $(this).find('i').removeClass('fa-chevron-right').addClass('fa-chevron-left');
                    $(this).find('span').text('收起菜单');
                }
                // 保存状态到本地存储
                localStorage.setItem('sidebarCollapsed', isCollapsed);
            });

            // 子菜单展开/收起
            $('.nav-item.submenu > .nav-link').click(function () {
                $(this).parent().toggleClass('open');
            });

            // 小屏幕侧边栏切换
            $('#sidebarToggle').click(function () {
                $('body').toggleClass('sidebar-collapsed');
            });

            // 加载保存的侧边栏状态
            if (localStorage.getItem('sidebarCollapsed') === 'true') {
                $('body').addClass('sidebar-collapsed');
                $('#toggleSidebar').find('i').removeClass('fa-chevron-left').addClass('fa-chevron-right');
                $('#toggleSidebar').find('span').text('展开菜单');
            }

            // 获取管理员用户名
            if (AuthUtil.isLoggedIn()) {
                const user = AuthUtil.getCurrentUser();
                if (user) {
                    $('#currentAdminUsername').text(user.nickname || user.username);
                }
            } else {
                // 未登录，跳转到登录页
                window.location.href = contextPath + 'login?redirect=' + encodeURIComponent(window.location.pathname);
            }
        });

        // 初始化页面
        function initPage() {
            const contextPath = /*[[@{/}]]*/ '';

            // 退出登录
            $('#logoutBtn').click(function () {
                AuthUtil.logout();
                window.location.href = contextPath + 'login';
            });
        }

        // 加载用户数据
        function loadUserData(page) {
            const contextPath = /*[[@{/}]]*/ '';
            const username = $('#usernameSearch').val();
            const status = $('#statusSearch').val();

            $.ajax({
                url: contextPath + 'api/admin/users',
                type: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + AuthUtil.getToken()
                },
                data: {
                    page: page,
                    size: 10,
                    username: username,
                    status: status
                },
                success: function (response) {
                    if (response.code === 200) {
                        renderUserTable(response.data.records);
                        renderPagination(response.data);
                    } else {
                        alert('获取用户数据失败：' + response.message);
                    }
                },
                error: function (xhr) {
                    alert('获取用户数据请求失败，状态码：' + xhr.status);
                }
            });
        }

        // 渲染用户表格
        function renderUserTable(users) {
            if (!users || users.length === 0) {
                $('#userTableBody').html('<tr><td colspan="8" class="text-center">暂无数据</td></tr>');
                return;
            }

            let html = '';
            users.forEach(function (user) {
                // 用户状态
                let statusHtml = '';
                if (user.status === 0) {
                    statusHtml = '<span class="badge bg-warning">待审核</span>';
                } else if (user.status === 1) {
                    statusHtml = '<span class="badge bg-success">正常</span>';
                } else if (user.status === 2) {
                    statusHtml = '<span class="badge bg-danger">禁用</span>';
                }

                // 格式化时间
                const createTime = new Date(user.createTime).toLocaleString();
                const lastLoginTime = user.lastLoginTime
                    ? new Date(user.lastLoginTime).toLocaleString()
                    : '-';

                html += `<tr>
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.nickname || '-'}</td>
                    <td>${user.email || '-'}</td>
                    <td>${statusHtml}</td>
                    <td>${createTime}</td>
                    <td>${lastLoginTime}</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-primary edit-user" data-id="${user.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button type="button" class="btn btn-sm btn-info roles-user ms-1" data-id="${user.id}">
                            <i class="fas fa-user-tag"></i>
                        </button>
                    </td>
                </tr>`;
            });

            $('#userTableBody').html(html);

            // 绑定编辑按钮事件
            $('.edit-user').click(function () {
                const userId = $(this).data('id');
                openUserEditModal(userId);
            });

            // 绑定角色管理按钮事件
            $('.roles-user').click(function () {
                const userId = $(this).data('id');
                openUserRolesModal(userId);
            });
        }

        // 渲染分页
        function renderPagination(pageData) {
            $('#totalCount').text(pageData.total);
            $('#currentPage').text(pageData.current);
            $('#totalPages').text(pageData.pages);

            let html = '';
            // 上一页
            html += `<li class="page-item ${pageData.current === 1 ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0);" data-page="${pageData.current - 1}">上一页</a>
            </li>`;

            // 生成页码
            const startPage = Math.max(1, pageData.current - 2);
            const endPage = Math.min(pageData.pages, pageData.current + 2);

            for (let i = startPage; i <= endPage; i++) {
                html += `<li class="page-item ${i === pageData.current ? 'active' : ''}">
                    <a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a>
                </li>`;
            }

            // 下一页
            html += `<li class="page-item ${pageData.current === pageData.pages ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0);" data-page="${pageData.current + 1}">下一页</a>
            </li>`;

            $('#pagination').html(html);

            // 绑定分页点击事件
            $('.page-link').click(function () {
                if (!$(this).parent().hasClass('disabled') && !$(this).parent().hasClass('active')) {
                    const page = $(this).data('page');
                    loadUserData(page);
                }
            });
        }

        // 打开用户编辑模态框
        function openUserEditModal(userId) {
            const contextPath = /*[[@{/}]]*/ '';

            // 清空表单
            $('#userEditForm')[0].reset();
            $('#userId').val(userId);

            // 获取用户信息
            $.ajax({
                url: contextPath + 'api/admin/users/' + userId,
                type: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + AuthUtil.getToken()
                },
                success: function (response) {
                    if (response.code === 200) {
                        const user = response.data;
                        // 填充表单
                        $('#username').val(user.username);
                        $('#nickname').val(user.nickname);
                        $('#email').val(user.email);
                        $('#status').val(user.status);

                        // 打开模态框
                        $('#userEditModal').modal('show');
                    } else {
                        alert('获取用户信息失败：' + response.message);
                    }
                },
                error: function (xhr) {
                    alert('获取用户信息请求失败，状态码：' + xhr.status);
                }
            });
        }

        // 保存用户信息
        function saveUser() {
            const contextPath = /*[[@{/}]]*/ '';
            const userId = $('#userId').val();
            const nickname = $('#nickname').val();
            const email = $('#email').val();
            const status = $('#status').val();
            const remark = $('#remark').val();

            $.ajax({
                url: contextPath + 'api/admin/users/' + userId,
                type: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + AuthUtil.getToken(),
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify({
                    nickname: nickname,
                    email: email,
                    status: status,
                    remark: remark
                }),
                success: function (response) {
                    if (response.code === 200) {
                        // 关闭模态框
                        $('#userEditModal').modal('hide');
                        // 重新加载数据
                        loadUserData($('#currentPage').text());
                    } else {
                        alert('保存用户信息失败：' + response.message);
                    }
                },
                error: function (xhr) {
                    alert('保存用户信息请求失败，状态码：' + xhr.status);
                }
            });
        }

        // 打开用户角色管理模态框
        function openUserRolesModal(userId) {
            // 这里实现用户角色管理的模态框
            alert('用户角色管理功能待开发，用户ID：' + userId);
        }
        /*]]>*/
    </script>
</body>

</html>
