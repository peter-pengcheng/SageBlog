<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制面板 - SageBlog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引用外部样式 -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .dashboard-container {
            padding: 2rem 0;
        }

        .dashboard-card {
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 1.5rem;
            height: 100%;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-card {
            border-left: 5px solid;
            height: 100%;
        }

        .stat-card-primary {
            border-left-color: #3498db;
        }

        .stat-card-success {
            border-left-color: #2ecc71;
        }

        .stat-card-warning {
            border-left-color: #f39c12;
        }

        .stat-card-danger {
            border-left-color: #e74c3c;
        }

        .stat-card i {
            font-size: 2.5rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book-reader me-2"></i>SageBlog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/blog}">
                            <i class="fas fa-blog me-1"></i>博客
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/dashboard}">
                            <i class="fas fa-tachometer-alt me-1"></i>控制面板
                        </a>
                    </li>
                </ul>
                <!-- 用户菜单 -->
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle me-1"></i><span id="currentUsername">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/profile}">
                                    <i class="fas fa-user me-2"></i>个人信息
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="javascript:void(0);" id="logoutBtn">
                                    <i class="fas fa-sign-out-alt me-2"></i>退出登录
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container dashboard-container">
        <div class="row mb-4">
            <div class="col-12">
                <h1><i class="fas fa-tachometer-alt me-2"></i>控制面板</h1>
                <p class="text-muted">欢迎回来，<span id="welcomeUsername">用户</span>！您可以在这里管理您的博客内容和账户。</p>
                <div id="loginAlert" class="alert alert-warning" style="display: none;">
                    您尚未登录或登录已过期。请 <a th:href="@{/login}" class="alert-link">登录</a> 后继续。
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-4 stats-row">
            <div class="col-md-3 mb-3">
                <div class="card stat-card stat-card-primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title text-muted mb-1">文章数量</h6>
                                <h2 class="mb-0 fw-bold" id="totalArticles">0</h2>
                            </div>
                            <i class="fas fa-newspaper text-primary"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card stat-card-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title text-muted mb-1">评论数量</h6>
                                <h2 class="mb-0 fw-bold" id="totalComments">0</h2>
                            </div>
                            <i class="fas fa-comments text-success"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card stat-card-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title text-muted mb-1">阅读量</h6>
                                <h2 class="mb-0 fw-bold" id="totalViews">0</h2>
                            </div>
                            <i class="fas fa-eye text-warning"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card stat-card-danger">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title text-muted mb-1">点赞数</h6>
                                <h2 class="mb-0 fw-bold" id="totalLikes">0</h2>
                            </div>
                            <i class="fas fa-heart text-danger"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 快速操作 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5 class="card-title mb-4">快速操作</h5>
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <a href="#" class="btn btn-primary d-block">
                                    <i class="fas fa-plus-circle me-2"></i>写新文章
                                </a>
                            </div>
                            <div class="col-md-3 mb-3">
                                <a href="#" class="btn btn-outline-primary d-block">
                                    <i class="fas fa-list me-2"></i>管理文章
                                </a>
                            </div>
                            <div class="col-md-3 mb-3">
                                <a href="#" class="btn btn-outline-primary d-block">
                                    <i class="fas fa-comment me-2"></i>评论管理
                                </a>
                            </div>
                            <div class="col-md-3 mb-3">
                                <a th:href="@{/profile}" class="btn btn-outline-primary d-block">
                                    <i class="fas fa-user-cog me-2"></i>个人设置
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近文章 -->
        <div class="row mb-4">
            <div class="col-md-6 mb-4">
                <div class="card dashboard-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="card-title mb-0">最近文章</h5>
                            <a href="#" class="btn btn-sm btn-outline-primary">查看全部</a>
                        </div>
                        <div id="recentArticles">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin mb-3 fa-2x text-primary"></i>
                                <p>加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card dashboard-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="card-title mb-0">最近评论</h5>
                            <a href="#" class="btn btn-sm btn-outline-primary">查看全部</a>
                        </div>
                        <div id="recentComments">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin mb-3 fa-2x text-primary"></i>
                                <p>加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p class="mb-0">&copy; 2023 SageBlog. 保留所有权利。</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-white me-3">隐私政策</a>
                    <a href="#" class="text-white">服务条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- 认证工具 -->
    <script th:src="@{/js/auth.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // 获取应用上下文路径
        const contextPath = /*[[@{/}]]*/ '';

        $(document).ready(function () {
            console.log('[控制面板] 页面已加载，准备初始化');

            // 检查登录状态
            if (!AuthUtil.isLoggedIn()) {
                console.log('[控制面板] 用户未登录，显示警告');
                $('#loginAlert').show();
                $('.stats-row').hide();
                return;
            }

            // 显示用户信息
            const user = AuthUtil.getCurrentUser();
            if (user) {
                const displayName = user.nickname || user.username || '用户';
                $('#currentUsername, #welcomeUsername').text(displayName);
            }

            // 模拟加载数据
            setTimeout(function () {
                // 更新统计数据
                $('#totalArticles').text('12');
                $('#totalComments').text('48');
                $('#totalViews').text('1,254');
                $('#totalLikes').text('86');

                // 加载最近文章
                let articlesHtml = '';
                for (let i = 1; i <= 5; i++) {
                    articlesHtml += `
                        <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                            <div class="flex-grow-1">
                                <h6 class="mb-1">示例文章标题 ${i}</h6>
                                <p class="small text-muted mb-0">
                                    <i class="far fa-clock me-1"></i>2023-06-${10 + i} · 
                                    <i class="far fa-eye me-1"></i>${Math.floor(Math.random() * 100)} 阅读
                                </p>
                            </div>
                            <div class="ms-3">
                                <span class="badge bg-success">已发布</span>
                            </div>
                        </div>
                    `;
                }
                $('#recentArticles').html(articlesHtml);

                // 加载最近评论
                let commentsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    commentsHtml += `
                        <div class="d-flex mb-3 pb-3 border-bottom">
                            <div class="flex-shrink-0 me-3">
                                <i class="fas fa-user-circle fa-2x text-secondary"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start">
                                    <h6 class="mb-0">用户${i}</h6>
                                    <small class="text-muted">2023-06-${20 - i}</small>
                                </div>
                                <p class="small mb-1">这是一条评论示例，展示了用户对博客文章的反馈。</p>
                                <p class="small text-muted mb-0">文章：示例文章标题 ${i}</p>
                            </div>
                        </div>
                    `;
                }
                $('#recentComments').html(commentsHtml);
            }, 1000);

            // 注册退出登录事件
            $('#logoutBtn').click(function () {
                console.log('[控制面板] 用户点击退出登录');
                AuthUtil.logout();
            });
        });
        /*]]>*/
    </script>
</body>

</html>
