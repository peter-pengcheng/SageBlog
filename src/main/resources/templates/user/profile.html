<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">个人中心 - SageBlog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <th:block th:fragment="styles">
        <style>
            .profile-container {
                max-width: 800px;
                margin: 2rem auto;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
                background-color: #fff;
            }

            .profile-header {
                text-align: center;
                margin-bottom: 2rem;
                padding-bottom: 1.5rem;
                border-bottom: 1px solid #eee;
            }

            .profile-avatar {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                margin: 0 auto 1.5rem;
                display: block;
                border: 3px solid #3498db;
                object-fit: cover;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }

            .profile-avatar:hover {
                transform: scale(1.05);
            }

            .profile-tabs {
                margin-bottom: 2rem;
            }

            .nav-tabs .nav-link {
                color: #495057;
                font-weight: 500;
                padding: 0.75rem 1.5rem;
                border: none;
                margin-right: 0.5rem;
                border-radius: 4px 4px 0 0;
                transition: all 0.3s ease;
            }

            .nav-tabs .nav-link.active {
                color: #3498db;
                border-bottom: 2px solid #3498db;
                background-color: transparent;
            }

            .tab-content {
                padding: 1.5rem 0;
            }

            .avatar-preview {
                margin: 1.5rem auto;
                text-align: center;
            }

            .avatar-preview img {
                max-width: 120px;
                max-height: 120px;
                border-radius: 50%;
                border: 2px solid #eee;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            }
        </style>
    </th:block>
</head>

<body>
    <div th:fragment="content">
        <div class="profile-container animate-fadeIn">
            <div class="profile-header">
                <h1 class="h3 mb-3">个人中心</h1>
                <img id="userAvatar" src="/sageblog/resources/avatars/default-avatar.jpg" alt="用户头像"
                    class="profile-avatar">
                <h4 id="userName" class="mt-3 mb-0"></h4>
                <a th:href="@{/}" class="btn btn-outline-primary mt-3">
                    <i class="fas fa-home me-1"></i>返回首页
                </a>
            </div>

            <ul class="nav nav-tabs profile-tabs" id="profileTabs">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#profile">
                        <i class="fas fa-user me-2"></i>个人资料
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#avatar">
                        <i class="fas fa-image me-2"></i>修改头像
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#password">
                        <i class="fas fa-key me-2"></i>修改密码
                    </a>
                </li>
            </ul>

            <div class="tab-content">
                <!-- 个人资料 -->
                <div class="tab-pane fade show active" id="profile">
                    <form id="profileForm">
                        <div class="card mb-4">
                            <div class="card-body">
                                <h5 class="card-title mb-4">基本信息</h5>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="nickname" class="form-label">昵称</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                                            <input type="text" class="form-control" id="nickname" name="nickname"
                                                required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">邮箱</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            <input type="email" class="form-control" id="email" name="email" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="phone" class="form-label">手机号</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                        <input type="text" class="form-control" id="phone" name="phone">
                                    </div>
                                </div>
                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                                        <i class="fas fa-undo me-1"></i>重置
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-1"></i>保存修改
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 修改头像 -->
                <div class="tab-pane fade" id="avatar">
                    <form id="avatarForm" enctype="multipart/form-data">
                        <div class="card mb-4">
                            <div class="card-body">
                                <h5 class="card-title mb-4">头像设置</h5>
                                <div class="mb-4">
                                    <label for="avatarFile" class="form-label">选择新头像</label>
                                    <input class="form-control" type="file" id="avatarFile" name="file"
                                        accept="image/*">
                                    <div class="form-text">支持JPG、PNG格式，大小不超过2MB</div>
                                </div>
                                <div class="avatar-preview" id="avatarPreview" style="display: none;">
                                    <h6 class="mb-3">预览</h6>
                                    <img id="previewImg" src="" alt="预览图">
                                </div>
                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <button type="button" id="cancelUpload" class="btn btn-outline-secondary me-md-2"
                                        style="display: none;">
                                        <i class="fas fa-times me-1"></i>取消
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-upload me-1"></i>上传头像
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 修改密码 -->
                <div class="tab-pane fade" id="password">
                    <form id="passwordForm">
                        <div class="card mb-4">
                            <div class="card-body">
                                <h5 class="card-title mb-4">密码修改</h5>
                                <div class="mb-3">
                                    <label for="oldPassword" class="form-label">当前密码</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" class="form-control" id="oldPassword" name="oldPassword"
                                            required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="newPassword" class="form-label">新密码</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                                        <input type="password" class="form-control" id="newPassword" name="newPassword"
                                            required>
                                    </div>
                                    <div class="form-text">密码长度需要在6-20个字符之间</div>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">确认新密码</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-check-circle"></i></span>
                                        <input type="password" class="form-control" id="confirmPassword"
                                            name="confirmPassword" required>
                                    </div>
                                </div>
                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                                        <i class="fas fa-undo me-1"></i>重置
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-1"></i>修改密码
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const contextPath = /*[[@{/}]]*/ '';

            // 导航到页面并添加token
            function navigateWithToken(page) {
                const token = localStorage.getItem('jwtToken');
                if (token) {
                    window.location.href = contextPath + page + '?token=' + encodeURIComponent(token);
                } else {
                    if (confirm('您需要先登录才能访问该页面，是否前往登录?')) {
                        window.location.href = contextPath + 'login?redirect=' + encodeURIComponent(contextPath + page);
                    }
                }
            }

            $(document).ready(function () {
                // 获取用户信息
                loadUserProfile();

                // 表单提交
                $('#profileForm').submit(function (e) {
                    e.preventDefault();
                    updateProfile();
                });

                $('#passwordForm').submit(function (e) {
                    e.preventDefault();
                    updatePassword();
                });

                $('#avatarForm').submit(function (e) {
                    e.preventDefault();
                    uploadAvatar();
                });

                // 图片预览
                $('#avatarFile').change(function () {
                    previewImage(this);
                    $('#cancelUpload').show();
                });

                // 取消上传
                $('#cancelUpload').click(function () {
                    $('#avatarFile').val('');
                    $('#avatarPreview').hide();
                    $(this).hide();
                });
            });

            // 获取用户信息
            function loadUserProfile() {
                $.ajax({
                    url: contextPath + 'api/users/profile',
                    type: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + getToken()
                    },
                    success: function (response) {
                        if (response.code === 200) {
                            const user = response.data;

                            // 设置用户信息
                            $('#userName').text(user.nickname || user.username);
                            $('#nickname').val(user.nickname || '');
                            $('#email').val(user.email || '');
                            $('#phone').val(user.phone || '');

                            // 设置头像
                            if (user.avatar) {
                                $('#userAvatar').attr('src', user.avatar);
                            }

                            // 更新localStorage中的用户信息，确保一致性
                            const currentUserStr = localStorage.getItem('currentUser');
                            if (currentUserStr) {
                                try {
                                    const currentUser = JSON.parse(currentUserStr);
                                    // 更新关键字段
                                    currentUser.nickname = user.nickname;
                                    currentUser.email = user.email;
                                    currentUser.phone = user.phone;
                                    currentUser.avatar = user.avatar;
                                    // 保存回localStorage
                                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                                } catch (e) {
                                    console.error('更新本地用户信息失败:', e);
                                }
                            }
                        } else {
                            showAlert('获取用户信息失败: ' + response.message, 'danger');
                            // 如果是未授权，可能是token过期，跳转到登录页
                            if (response.code === 401) {
                                redirectToLogin();
                            }
                        }
                    },
                    error: function (xhr) {
                        handleAjaxError(xhr);
                    }
                });
            }

            // 更新个人资料
            function updateProfile() {
                const profileData = {
                    nickname: $('#nickname').val(),
                    email: $('#email').val(),
                    phone: $('#phone').val()
                };

                $.ajax({
                    url: contextPath + 'api/users/info',
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(profileData),
                    headers: {
                        'Authorization': 'Bearer ' + getToken()
                    },
                    success: function (response) {
                        if (response.code === 200) {
                            showAlert('个人资料更新成功', 'success');
                            // 更新页面上的用户名
                            $('#userName').text(profileData.nickname);
                        } else {
                            showAlert('更新失败: ' + response.message, 'danger');
                        }
                    },
                    error: function (xhr) {
                        handleAjaxError(xhr);
                    }
                });
            }

            // 更新密码
            function updatePassword() {
                // 验证两次密码输入是否一致
                const newPassword = $('#newPassword').val();
                const confirmPassword = $('#confirmPassword').val();

                if (newPassword !== confirmPassword) {
                    showAlert('两次输入的密码不一致', 'danger');
                    return;
                }

                // 使用JSON请求体传递数据
                const passwordData = {
                    oldPassword: $('#oldPassword').val(),
                    newPassword: newPassword
                };

                $.ajax({
                    url: contextPath + 'api/users/password',
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(passwordData),
                    headers: {
                        'Authorization': 'Bearer ' + getToken()
                    },
                    success: function (response) {
                        if (response.code === 200) {
                            showAlert('密码修改成功', 'success');
                            // 清空表单
                            $('#passwordForm')[0].reset();
                        } else {
                            showAlert('密码修改失败: ' + response.message, 'danger');
                        }
                    },
                    error: function (xhr) {
                        handleAjaxError(xhr);
                    }
                });
            }

            // 上传头像
            function uploadAvatar() {
                const fileInput = $('#avatarFile')[0];
                if (fileInput.files.length === 0) {
                    showAlert('请选择一个文件', 'warning');
                    return;
                }

                const formData = new FormData();
                formData.append('file', fileInput.files[0]);

                $.ajax({
                    url: contextPath + 'api/users/avatar',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {
                        'Authorization': 'Bearer ' + getToken()
                    },
                    success: function (response) {
                        if (response.code === 200) {
                            // 更新头像显示
                            const avatar = response.data.avatar;
                            $('#userAvatar').attr('src', avatar);

                            showAlert('头像上传成功', 'success');
                            // 清空表单
                            $('#avatarFile').val('');
                            $('#avatarPreview').hide();
                            $('#cancelUpload').hide();
                        } else {
                            showAlert('上传失败: ' + response.message, 'danger');
                        }
                    },
                    error: function (xhr) {
                        handleAjaxError(xhr);
                    }
                });
            }

            // 图片预览
            function previewImage(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        $('#previewImg').attr('src', e.target.result);
                        $('#avatarPreview').show();
                    }
                    reader.readAsDataURL(input.files[0]);
                }
            }

            // 显示提示信息
            function showAlert(message, type) {
                const alertHtml = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;

                // 清除现有提示
                $('.alert').alert('close');

                // 添加新提示
                $('.profile-container').prepend(alertHtml);

                // 5秒后自动关闭
                setTimeout(function () {
                    $('.alert').alert('close');
                }, 5000);
            }

            // 获取token
            function getToken() {
                return localStorage.getItem('jwtToken');
            }

            // 跳转到登录页
            function redirectToLogin() {
                localStorage.removeItem('jwtToken');
                window.location.href = contextPath + 'login?redirect=' + encodeURIComponent(window.location.pathname);
            }

            // 处理Ajax错误
            function handleAjaxError(xhr) {
                try {
                    const response = JSON.parse(xhr.responseText);
                    showAlert('操作失败: ' + response.message, 'danger');

                    // 如果是未授权错误（401），重定向到登录页面
                    if (xhr.status === 401) {
                        redirectToLogin();
                    }
                } catch (e) {
                    if (xhr.status === 401) {
                        showAlert('会话已过期，请重新登录', 'warning');
                        redirectToLogin();
                    } else {
                        showAlert('操作失败，请稍后重试', 'danger');
                    }
                }
            }
        </script>
    </th:block>
</body>

</html>
