<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - SageBlog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引用外部样式 -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .forgot-password-container {
            max-width: 450px;
            margin: 5rem auto;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            transition: transform 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
        }

        .forgot-password-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .forgot-password-icon {
            margin-bottom: 1.5rem;
        }

        .forgot-password-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book-reader me-2"></i>SageBlog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i>登录
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/register}">
                            <i class="fas fa-user-plus me-1"></i>注册
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main>
        <div class="forgot-password-container">
            <div class="forgot-password-header">
                <div class="forgot-password-icon">
                    <i class="fas fa-key fa-4x text-primary"></i>
                </div>
                <h1 class="h3 mb-3">找回密码</h1>
                <p class="text-muted">请输入您的注册邮箱，我们将向您发送重置密码的链接</p>
            </div>

            <!-- 找回密码表单 -->
            <form id="forgotPasswordForm">
                <!-- 成功消息 -->
                <div id="success-message" class="alert alert-success mb-4" style="display: none;">
                    <i class="fas fa-check-circle me-2"></i><span id="success-text">重置链接已发送到您的邮箱，请查收</span>
                </div>

                <!-- 错误消息 -->
                <div id="error-message" class="alert alert-danger mb-4" style="display: none;">
                    <i class="fas fa-exclamation-circle me-2"></i><span id="error-text">发送失败</span>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">邮箱地址</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="请输入您的注册邮箱"
                            required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-paper-plane me-2"></i>发送重置链接
                    </button>
                </div>
            </form>

            <div class="forgot-password-footer">
                <div>
                    <a th:href="@{/login}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>返回登录
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p class="mb-0">&copy; 2023 SageBlog. 保留所有权利。</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-white me-3">隐私政策</a>
                    <a href="#" class="text-white">服务条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const contextPath = /*[[@{/}]]*/ '';

        $(document).ready(function () {
            // 表单提交
            $('#forgotPasswordForm').submit(function (e) {
                e.preventDefault();

                // 显示加载状态
                const submitBtn = $('#submitBtn');
                const originalText = submitBtn.html();
                submitBtn.html('<i class="fas fa-spinner fa-spin me-2"></i>发送中...');
                submitBtn.prop('disabled', true);

                // 隐藏之前的消息
                $('#success-message').hide();
                $('#error-message').hide();

                // 构建请求数据
                const email = $('#email').val();
                const requestData = {
                    email: email
                };

                // 发送请求
                $.ajax({
                    url: contextPath + 'api/auth/forgot-password',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(requestData),
                    success: function (response) {
                        // 恢复按钮状态
                        submitBtn.html(originalText);
                        submitBtn.prop('disabled', false);

                        if (response.code === 200) {
                            // 显示成功消息
                            $('#success-text').text('重置链接已发送到您的邮箱，请查收');
                            $('#success-message').show();
                            // 清空表单
                            $('#email').val('');
                        } else {
                            // 显示错误消息
                            $('#error-text').text(response.message);
                            $('#error-message').show();
                        }
                    },
                    error: function (xhr) {
                        // 恢复按钮状态
                        submitBtn.html(originalText);
                        submitBtn.prop('disabled', false);

                        try {
                            const response = JSON.parse(xhr.responseText);
                            $('#error-text').text(response.message);
                        } catch (e) {
                            $('#error-text').text('发送失败，请稍后重试');
                        }
                        $('#error-message').show();
                    }
                });
            });
        });
        /*]]>*/
    </script>
</body>

</html>
