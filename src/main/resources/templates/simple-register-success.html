<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册成功 - SageBlog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引用外部样式 -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .success-container {
            max-width: 600px;
            margin: 5rem auto;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            text-align: center;
            animation: fadeIn 0.5s ease forwards;
        }

        .success-icon {
            color: #28a745;
            font-size: 5rem;
            margin-bottom: 2rem;
            animation: pulse 1.5s infinite;
        }

        .countdown {
            font-weight: bold;
            color: #3498db;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book-reader me-2"></i>SageBlog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i>登录
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main>
        <div class="success-container">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 class="mb-4">注册成功!</h1>
            <p class="lead mb-4">您的账号已成功注册，感谢您加入 SageBlog!</p>
            <div class="alert alert-info mb-4">
                <i class="fas fa-info-circle me-2"></i>
                您的账号需要管理员审核后才能使用，请耐心等待。我们会通过邮件通知您审核结果。
            </div>
            <div class="mb-4">
                <p>页面将在 <span id="countdown" class="countdown">5</span> 秒后自动跳转到登录页面</p>
            </div>
            <div>
                <a th:href="@{/login}" class="btn btn-primary btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>立即登录
                </a>
                <a th:href="@{/}" class="btn btn-outline-primary btn-lg ms-2">
                    <i class="fas fa-home me-2"></i>返回首页
                </a>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p class="mb-0">&copy; 2023 SageBlog. 保留所有权利。</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-white me-3">隐私政策</a>
                    <a href="#" class="text-white">服务条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // 倒计时跳转
            let seconds = 5;
            const countdownElement = $('#countdown');

            const interval = setInterval(function () {
                seconds--;
                countdownElement.text(seconds);

                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = '/sageblog/login';
                }
            }, 1000);
        });
    </script>
</body>

</html>
