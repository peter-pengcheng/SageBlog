# 静态资源配置
spring.mvc.static-path-pattern=/static/**,/css/**,/js/**,/img/**
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=3600

# 关闭thymeleaf缓存
spring.thymeleaf.cache=false

# 调试静态资源加载
logging.level.org.springframework.web.servlet.resource=DEBUG 

# SageBlog 应用配置
sageblog.base-url=http://localhost:8080
sageblog.file.upload-dir=./uploads

# 邮件配置
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
sageblog.mail.from=noreply@sageblog.com
sageblog.mail.admin-notification=true

# 密码重置配置
sageblog.password-reset.expiration=24
sageblog.password-reset.url=${sageblog.base-url}/reset-password 